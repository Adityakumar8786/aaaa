# =============================================================================
#  CENTRAL CONFIG  --  every knob of the benchmark lives in this one file.
#  Relative paths are resolved relative to this file.
# =============================================================================

paths:
  spider_dir: ./spider          # folder containing tables.json, dev.json, database/ ...
  data_dir: ./data              # gold.json is written here by `prepare`
  results_dir: ./results        # one <config>.jsonl per configuration
  cache_path: ./.cache/llm_cache.sqlite   # LLM + embedding response cache (makes re-runs free)
  report_path: ./report.md

# ----------------------------------------------------------------------------
#  Gold dataset: ONE Spider database with >= min_tables tables, N questions,
#  the SAME questions are used for every configuration below.
# ----------------------------------------------------------------------------
dataset:
  db_id: auto                   # "auto" = pick the DB with >= min_tables tables and the most questions
  min_tables: 20
  n_questions: 50
  seed: 42
  question_files: [train_spider.json, train_others.json, dev.json]   # missing files are skipped
  bucket_mix: {1: 0.30, 2: 0.40, 3: 0.30}   # share of questions needing 1 / 2 / 3+ tables
  exclude_empty_gold: true      # drop questions whose gold SQL returns 0 rows (too easy to match)

# ----------------------------------------------------------------------------
#  Groq (free tier).  rpm / tpm are enforced client-side so you stay under the
#  free-tier limits. Check your real limits at https://console.groq.com/settings/limits
#  and adjust.  If you hit a daily cap the run stops cleanly; re-run to resume.
#
#  Free-tier limits seen at time of writing (verify in your console - they change):
#    llama-3.1-8b-instant     30 RPM | 6K TPM  | 14.4K RPD | 500K TPD   <- default (fits a full benchmark in ~1-2 days)
#    llama-3.3-70b-versatile  30 RPM | 12K TPM | 1K RPD    | 100K TPD   (better SQL, but ~7 days of daily quota)
#  Run `python -m nl2sql estimate` to see the token budget of YOUR gold set before spending any.
# ----------------------------------------------------------------------------
llm:
  model: llama-3.1-8b-instant
  temperature: 0.0
  max_tokens: 512
  rpm: 25
  tpm: 5500          # for 70b use ~11000
  max_retries: 6
  max_wait_seconds: 90          # if Groq asks us to wait longer than this, stop (daily cap)
  use_cache: true

execution:
  timeout_s: 15                 # per-query SQLite timeout

# ----------------------------------------------------------------------------
#  Defaults shared by all configurations (each config below may override any key)
# ----------------------------------------------------------------------------
defaults:
  k: 8                          # number of tables put in the SQL-generation prompt
  candidates_k: 15              # candidate pool handed to the reranker (rerank configs only)

  # --- vector search ---
  embedder_type: groq           # groq | tfidf_char | sentence_transformers
  embedder_model: nomic-embed-text-v1_5     # model name for groq / sentence_transformers
  embedder_fallback: tfidf_char # used (loudly) if the embeddings endpoint is unavailable; "none" = fail instead

  # --- BM25 ---
  bm25_k1: 1.5
  bm25_b: 0.75

  # --- hybrid fusion ---
  fusion: rrf                   # rrf (reciprocal rank fusion) | weighted
  rrf_k: 60
  alpha: 0.5                    # weight of vector score when fusion: weighted

  # --- error-fix (retry) loop: OFF unless a config sets max_retries > 0 (or you pass --max-retries N on the CLI) ---
  max_retries: 2            # extra attempts per question after a failed one
  retry_on_empty: true          # an empty result set counts as a failure (gold questions never have empty answers)
  retry_judge: true             # an LLM judge may also reject a query that ran fine (+1 LLM call per attempt)
  retry_schema: hybrid_rerank   # schema used on a retry: hybrid_rerank (re-retrieve with the error text + LLM rerank, merged
                                #   with the tables already shown) | neighbors (add FK neighbours) | none (same schema)
  retry_full_schema_last: true  # the LAST allowed retry shows the FULL schema (safety net for retrieval misses)
  judge_rows: 5                 # result rows shown to the judge

  # --- foreign-key expansion (only when fk_expand: true) ---
  fk_mode: bridge               # bridge = add tables that join >=2 selected tables | neighbors = add all 1-hop FK neighbours
  fk_max_added: 3
  fk_infer_shared_id: true      # also treat shared *_id column names as join edges (for DBs with sparse FK metadata)

# ----------------------------------------------------------------------------
#  The configurations that get compared.  Add / remove / tweak freely.
#  retriever: full | vector | hybrid      rerank: LLM reranker      fk_expand: FK bridge tables
# ----------------------------------------------------------------------------
configs:
  full_schema:
    description: Baseline - the entire schema goes into the prompt
    retriever: full

  topk_vector:
    description: Top-k tables by vector similarity
    retriever: vector

  hybrid:
    description: Top-k tables by vector + BM25 (reciprocal rank fusion)
    retriever: hybrid

  topk_vector_rerank:
    description: Vector top-N candidates -> LLM reranker keeps best k
    retriever: vector
    rerank: true

  hybrid_rerank:
    description: Hybrid top-N candidates -> LLM reranker keeps best k
    retriever: hybrid
    rerank: true

  all_combined:
    description: Hybrid -> LLM reranker -> FK bridge expansion
    retriever: hybrid
    rerank: true
    fk_expand: true

  # ---- same pipelines + error-fix loop (2 retries). Use `--max-retries N` to try other values without editing this file ----
  full_schema_retry:
    description: full_schema + error-fix loop (2 retries)
    retriever: full
    max_retries: 2

  hybrid_retry:
    description: hybrid + error-fix loop (2 retries)
    retriever: hybrid
    max_retries: 2

  all_combined_retry:
    description: hybrid -> reranker -> FK expansion + error-fix loop (2 retries)
    retriever: hybrid
    rerank: true
    fk_expand: true
    max_retries: 2